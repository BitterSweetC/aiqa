name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Run Ruff lint across repository
        run: ruff check .
      - name: Run suite except dedicated smoke marker
        run: pytest -m 'not browser' --junitxml=test-results/unit-${{ matrix.python-version }}.xml
      - name: Upload failure reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-failure-reports-${{ matrix.python-version }}
          path: test-results/
          if-no-files-found: ignore

  browser-smoke:
    name: Chromium smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install package
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Run deterministic browser smoke test
        run: pytest tests/test_browser_smoke.py --junitxml=test-results/browser.xml
      - name: Upload failure reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-reports
          path: test-results/
          if-no-files-found: ignore
