[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aiqa"
version = "0.1.0"
description = "AI-powered autonomous website testing system"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "MIT"

dependencies = [
    "pydantic>=2.0,<3",
    "click>=8.0,<9",
    "openai>=1.0,<3",
    "rich>=13.0,<15",
    "playwright>=1.40,<2",
]

[project.optional-dependencies]
# jev-ultrafast is not yet on PyPI; install manually from source when available:
# pip install git+https://github.com/browser-use/jev-ultrafast.git
jev = [
    "jev-ultrafast>=0.1.0",
]
dev = [
    "pytest>=8.0,<10",
    "pytest-asyncio>=0.23,<2",
    "ruff>=0.4,<1",
]

[project.scripts]
aiqa = "aiqa.cli:cli"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "browser: deterministic local tests that require an installed Chromium browser",
]
