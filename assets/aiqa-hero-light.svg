    <text x="14" y="27" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="12.5" fill="#2563eb">1. Crawl &amp; Inspect</text>
    <text x="14" y="49" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#0f172a">12 routes crawled</text>
    <text x="14" y="67" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#475569">DOM • Forms • Auth</text>
