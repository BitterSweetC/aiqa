    <text x="548" y="49" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#0f172a">DOM • URL • A11y</text>
    <text x="548" y="67" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#475569">Download • Vision</text>
    <text x="548" y="84" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="600" font-size="10.5" fill="#059669">100% Recall (4/4)</text>

