    <rect x="356" y="0" width="160" height="96" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="370" y="27" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="12.5" fill="#d97706">3. Closed-Loop Act</text>
    <text x="370" y="49" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#0f172a">Observe → Act → Diff</text>
    <text x="370" y="67" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#475569">Auto-dismiss modals</text>
    <text x="370" y="84" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="600" font-size="10.5" fill="#059669">p50: 370.0 ms</text>

