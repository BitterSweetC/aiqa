  <text x="42" y="216" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="700" font-size="12" fill="#059669">✔ SUITE PASSED: 6/6 (100.0%)</text>
  <text x="878" y="216" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#0f172a">Coverage: 100%  |  Defect Recall: 4/4  |  Overhead: 1.201x  |  Tests: 132/132 Passing</text>
