    <rect x="178" y="0" width="160" height="96" rx="10" fill="#ffffff" stroke="#06b6d4" stroke-width="1.5"/>
    <text x="192" y="27" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="12.5" fill="#0891b2">2. Goal Planner</text>
    <text x="192" y="49" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#0f172a">6 DAG test cases</text>
    <text x="192" y="67" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#475569">Heuristic + LLM</text>
