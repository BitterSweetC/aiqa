      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2ff"/>
    </linearGradient>
  </defs>
  <rect width="920" height="260" rx="16" fill="url(#bg)" stroke="#cbd5e1" stroke-width="2"/>

  <!-- Top Terminal Command Bar -->
  <rect x="24" y="20" width="872" height="36" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <circle cx="44" cy="38" r="6" fill="#ef4444"/>
  <circle cx="64" cy="38" r="6" fill="#f59e0b"/>
  <circle cx="84" cy="38" r="6" fill="#10b981"/>
  <text x="108" y="42" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12.5" fill="#334155">$ aiqa auto --url https://shop.example.com --goal "Verify search, cart &amp; checkout" --workers 2</text>

  <!-- Pipeline Cards -->
  <g transform="translate(24, 72)">
