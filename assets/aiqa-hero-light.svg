    <text x="726" y="49" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#0f172a">HTML • JUnit • JSON</text>
    <text x="726" y="67" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#475569">1-Click Re-run CLI</text>
    <text x="726" y="84" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="600" font-size="10.5" fill="#059669">PASS 6/6 (1.13s)</text>
